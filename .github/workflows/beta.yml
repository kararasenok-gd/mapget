name: Build and Release Beta Paper Plugin

on:
  push:
    branches:
      - beta
    paths:
      - 'src/**'
      - 'build.gradle*'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'gradle/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Get version and commit SHA
        id: get_version
        run: |
          BASE_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | xargs)
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_VERSION="${BASE_VERSION}-${SHORT_SHA}"
          
          echo "BASE_VERSION=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.FULL_VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            echo "Tag v${{ steps.get_version.outputs.FULL_VERSION }} already exists. Skipping release."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Generate Changelog
        if: env.TAG_EXISTS == 'false'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          VERSION="${{ steps.get_version.outputs.FULL_VERSION }}"
          REPO_URL="https://github.com/${{ github.repository }}"
          
          echo "## Beta Changes for v$VERSION" > changelog_body.md
          echo "" >> changelog_body.md
          
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          git log $RANGE --pretty=format:"%h|%H|%s" | while IFS='|' read -r short_hash long_hash subject; do
            if echo "$subject" | grep -qE '^(feat|fix|refactor|perf|style|test|build|ci)(\(.*\))?:'; then
              formatted_subject=$(echo "$subject" | sed -E 's/^([a-z]+(\(.*\))?:)/**\1**/')
              echo "- [\`$short_hash\`]($REPO_URL/commit/$long_hash) $formatted_subject" >> changelog_body.md
            fi
          done
          
          if [ $(wc -l < changelog_body.md) -le 2 ]; then
            echo "- Beta build from commit ${{ steps.get_version.outputs.SHORT_SHA }}" >> changelog_body.md
          fi
          
          echo "" >> changelog_body.md
          if [ ! -z "$PREV_TAG" ]; then
            echo "**Full Compare**: [\`$PREV_TAG...v$VERSION\`]($REPO_URL/compare/$PREV_TAG...v$VERSION)" >> changelog_body.md
          fi
          
          {
            echo 'body<<EOF'
            cat changelog_body.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        if: env.TAG_EXISTS == 'false'
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Create Beta Release
        if: env.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.FULL_VERSION }}
          name: v${{ steps.get_version.outputs.FULL_VERSION }} (Beta)
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}