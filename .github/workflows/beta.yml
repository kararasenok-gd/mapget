name: Build and Release Beta Paper Plugin

on:
  push:
    branches:
      - beta
    paths:
      - 'src/**'
      - 'build.gradle*'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'gradle/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Get version and metadata
        id: get_version
        run: |
          BASE_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | sed 's/-beta.*//' | xargs)
          
          RUN_NUM=${{ github.run_number }}
          
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          TAG_NAME="v${BASE_VERSION}-beta.${RUN_NUM}"
          RELEASE_TITLE="v${BASE_VERSION}-beta.${RUN_NUM} (${SHORT_SHA})"
          
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=$RELEASE_TITLE" >> $GITHUB_OUTPUT
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: tag_check
        run: |
          if git rev-parse "${{ steps.get_version.outputs.TAG_NAME }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Build with Gradle
        if: env.TAG_EXISTS == 'false'
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Create Beta Release
        if: env.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: ${{ steps.get_version.outputs.RELEASE_TITLE }}
          draft: false
          prerelease: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}