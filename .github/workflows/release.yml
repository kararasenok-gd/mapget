name: Build and Release Paper Plugin

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'build.gradle*'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'gradle/**'

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag_exists: ${{ steps.tag_check.outputs.TAG_EXISTS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.VERSION }} already exists. Skipping release."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: build/libs/*.jar
          retention-days: 1

  changelog:
    needs: check
    if: needs.check.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          REPO_URL="https://github.com/${{ github.repository }}"

          if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            PREV_TAG=$(git tag --list 'v*' --sort=-version:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n 1 || true)
          else
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi

          echo "Current version: v$VERSION"
          echo "Previous tag: ${PREV_TAG:-none}"

          echo "## Changes for v$VERSION" > changelog_body.md
          echo "" >> changelog_body.md

          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV_TAG..HEAD"
          fi

          git log --reverse $RANGE --pretty=format:"%h|%H|%s" | while IFS='|' read -r short_hash long_hash subject; do
            if echo "$subject" | grep -qE '^(feat|fix|refactor|perf|style|test|build|ci)(\(.*\))?:'; then
              formatted_subject=$(echo "$subject" | sed -E 's/^([a-z]+(\(.*\))?:)/**\1**/')
              echo "- [\`$short_hash\`]($REPO_URL/commit/$long_hash) $formatted_subject" >> changelog_body.md
            fi
          done

          if [ $(wc -l < changelog_body.md) -le 2 ]; then
            echo "- Minor improvements and bug fixes." >> changelog_body.md
          fi

          echo "" >> changelog_body.md

          if [ -n "$PREV_TAG" ]; then
            echo "**Full Changelog**: [\`$PREV_TAG...v$VERSION\`]($REPO_URL/compare/$PREV_TAG...v$VERSION)" >> changelog_body.md
          fi

          {
            echo 'body<<EOF'
            cat changelog_body.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

  release:
    needs: [check, build, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: build/libs

      - name: Get JAR info
        id: plugin_file
        run: |
          JAR_PATH=$(find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)
          JAR_NAME=$(basename "$JAR_PATH")
          echo "JAR_PATH=$JAR_PATH" >> $GITHUB_OUTPUT
          echo "JAR_NAME=$JAR_NAME" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          body: ${{ needs.changelog.outputs.body }}
          draft: false
          prerelease: false
          files: build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          VERSION: ${{ needs.check.outputs.version }}
          CHANGELOG: ${{ needs.changelog.outputs.body }}
          JAR_PATH: ${{ steps.plugin_file.outputs.JAR_PATH }}
          JAR_NAME: ${{ steps.plugin_file.outputs.JAR_NAME }}
        run: |
          SAFE_CHANGELOG=$(echo "$CHANGELOG" | jq -aRs .)

          DATA_JSON=$(cat <<EOF
          {
            "name": "mapget v$VERSION",
            "version_number": "$VERSION",
            "changelog": $SAFE_CHANGELOG,
            "game_versions": ["1.21", "1.21.1", "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11", "26.1", "26.1.1", "26.1.2", "26.2"],
            "loaders": ["paper"],
            "project_id": "$PROJECT_ID",
            "file_parts": ["file_0"],
            "dependencies": [],
            "version_type": "release",
            "featured": true
          }
          EOF
          )

          curl -X POST 'https://api.modrinth.com/v2/version' \
            --header "User-Agent: kararasenok-gd/mapget/$VERSION (kararasenok.space)" \
            --header "Authorization: $MODRINTH_TOKEN" \
            --form "data=$DATA_JSON" \
            --form "file_0=@$JAR_PATH;type=application/java-archive"
