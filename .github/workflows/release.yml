name: Build and Release Paper Plugin

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'build.gradle*'
      - 'gradle.properties'
      - 'settings.gradle*'
      - 'gradle/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Get version from gradle.properties
        id: get_version
        run: |
          VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | xargs)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if Tag Exists
        id: tag_check
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
            echo "Tag v${{ steps.get_version.outputs.VERSION }} already exists. Skipping release."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Generate Changelog
        if: env.TAG_EXISTS == 'false'
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          REPO_URL="https://github.com/${{ github.repository }}"
          
          if [ -z "$PREV_TAG" ]; then
            echo "This is first release." > changelog.md
          else
            echo "**Full Changelog**: $REPO_URL/compare/$PREV_TAG...v${{ steps.get_version.outputs.VERSION }}" > changelog.md
          fi
          
          {
            echo 'body<<EOF'
            cat changelog.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        if: env.TAG_EXISTS == 'false'
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Create Release
        if: env.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: v${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}