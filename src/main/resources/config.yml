# mapget configuration
# Apply changes with /map reload or by restarting the server.

# All messages are in MiniMessage format.
# Use this for preview: https://webui.advntr.dev/

# --- Maps ---
map:
  # Store maps only in RAM. They are cleared when the server restarts.
  # false stores maps in database.db and local storage.
  # Default: false
  temp: false

  # Default name for maps given through /map get.
  # Available variables: %id% - map ID
  # Default: <gold>Image #%id%
  name: "<gold>Image #%id%"

  # Default map lore.
  # Available variables:
  #   %id% - map ID
  #   %player% - in-game name of the player who created the map
  #   %url% - image URL
  #   %timestamp% - creation time; see the timestamp section below
  # Default: <gray>Created by <aqua>%player%</aqua> at <aqua>%timestamp%</aqua>
  lore: "<gray>Created by <aqua>%player%</aqua> at <aqua>%timestamp%</aqua>"

  # Default value for the crop argument.
  # true crops the image; false resizes it to a 1:1 ratio.
  # Default: false
  cropDefault: false

  # Allow temporary maps through /map get <url> temp:<true/false>.
  # Players with mapget.temp permission bypass this setting.
  # Default: false
  allowTemporaryMaps: false

  # Try to download the file again if it is not locally available.
  # Default: true
  tryToRecover: true

# --- Network ---
connection:
  # Timeout for establishing a URL connection, in milliseconds.
  # Default: 5000 (5 seconds)
  timeout: 5000

  # Timeout for reading URL content, in milliseconds.
  # Default: 10000 (10 seconds)
  readTimeout: 10000

  # Maximum downloaded file size, in MB.
  # Default: 8 MB
  maxSize: 8

  whitelist:
    # List of allowed domains.
    # Add "*" to disable it.
    # Default: ["*"]
    domains:
      - "*" # Remove this to enable whitelist
      - "files.catbox.moe"
      - "cdn.discordapp.com"

    # Should whitelist act as blacklist?
    # Default: false
    actAsBlacklist: false

# --- Timestamps ---
timestamp:
  # Settings for the %timestamp% placeholder.

  # Display format. Java DateTimeFormatter patterns:
  # https://docs.oracle.com/javase/8/docs/api/java/time/format/DateTimeFormatter.html#patterns
  # Or: https://gist.github.com/kararasenok-gd/c34f6121623db4febc846ad2f615996d
  # Default: yyyy-MM-dd HH:mm:ssXXX
  format: "yyyy-MM-dd HH:mm:ssXXX"

  # UTC offset. List of time zones:
  # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
  # Default: +00:00
  utcOffset: "+00:00"

# --- Updates ---
updates:
  # Check for plugin updates.
  # Default: true
  check: true

  # Use beta releases instead of stable releases.
  # Beta versions may contain bugs, but receive new features earlier.
  # Default: false
  beta: false
